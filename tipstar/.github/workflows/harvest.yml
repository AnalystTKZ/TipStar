name: TipStar Harvest Pipeline

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run harvest pipeline
        env:
          SUPABASE_DB_URL:      ${{ secrets.SUPABASE_DB_URL }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL:           ${{ secrets.GROQ_MODEL }}
          NEWS_API_KEY:         ${{ secrets.NEWS_API_KEY }}
          NOTION_API_KEY:       ${{ secrets.NOTION_API_KEY }}
          NOTION_PLAYERS_DB_ID: ${{ secrets.NOTION_PLAYERS_DB_ID }}
          NOTION_TEAMS_DB_ID:   ${{ secrets.NOTION_TEAMS_DB_ID }}
          NOTION_DRAMA_DB_ID:   ${{ secrets.NOTION_DRAMA_DB_ID }}
          NOTION_CONFIG_PAGE_ID: ${{ secrets.NOTION_CONFIG_PAGE_ID }}
          NOTION_MATCHES_DB_ID: ${{ secrets.NOTION_MATCHES_DB_ID }}
        run: python -m backend.scheduler.orchestrator
